<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 400px;
            padding: 32px 28px;
            border: 1px solid #e5e7eb;
        }

        .form-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .form-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 6px;
        }

        .form-header p {
            font-size: 14px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            color: #1f2937;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .form-group input.input-error {
            border-color: #dc2626;
        }

        .form-group input.input-error:focus {
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
        }

        .error-message {
            font-size: 12px;
            color: #dc2626;
            margin-top: 6px;
            font-weight: 500;
            display: none;
        }

        .error-message.visible {
            display: block;
        }

        .submit-btn {
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            padding: 11px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background-color: #1d4ed8;
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        .success-message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #15803d;
            font-size: 14px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
        }

        .success-message.visible {
            display: block;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="form-header">
            <h2>Account Login</h2>
            <p>Please enter your credentials below</p>
        </div>

        <form id="validationForm" novalidate>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="name@example.com"
                >
                <div id="emailError" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••••"
                >
                <div id="passwordError" class="error-message"></div>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
            <div id="successMessage" class="success-message">
                Form submitted successfully!
            </div>
        </form>
    </div>

    <script>
        document.getElementById('validationForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const emailValue = emailInput.value.trim();
            const passwordValue = passwordInput.value;

            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');
            const successMessage = document.getElementById('successMessage');

            let isValid = true;
            emailError.textContent = '';
            emailError.classList.remove('visible');
            emailInput.classList.remove('input-error');

            passwordError.textContent = '';
            passwordError.classList.remove('visible');
            passwordInput.classList.remove('input-error');
            
            successMessage.classList.remove('visible');

            function showError(inputEl, errorEl, message) {
                errorEl.textContent = message;
                errorEl.classList.add('visible');
                inputEl.classList.add('input-error');
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (emailValue === '') {
                showError(emailInput, emailError, 'please enter your email');
                isValid = false;
            } else if (!emailRegex.test(emailValue)) {
                showError(emailInput, emailError, 'please enter a valid email');
                isValid = false;
            }

            const hasCapital = /[A-Z]/;
            const hasSmall = /[a-z]/;
            const hasDigit = /[0-9]/;
            const hasSpecial = /[^A-Za-z0-9]/;

            if (passwordValue === '') {
                showError(passwordInput, passwordError, 'please enter your password');
                isValid = false;
            } else if (passwordValue.length < 8) {
                showError(passwordInput, passwordError, 'Password must be 8 characters at least');
                isValid = false;
            } else if (!hasCapital.test(passwordValue)) {
                showError(passwordInput, passwordError, 'please enter one capital letter at least');
                isValid = false;
            } else if (!hasSmall.test(passwordValue)) {
                showError(passwordInput, passwordError, 'please enter one small letter at least');
                isValid = false;
            } else if (!hasDigit.test(passwordValue)) {
                showError(passwordInput, passwordError, 'please enter one digit at least');
                isValid = false;
            } else if (!hasSpecial.test(passwordValue)) {
                showError(passwordInput, passwordError, 'please enter one special character at least');
                isValid = false;
            } else if (/\s/.test(passwordValue)) {
                showError(passwordInput, passwordError, 'password should not contain spaces');
                isValid = false;
            } else if (passwordValue === emailValue) {
                showError(passwordInput, passwordError, 'password should not be the same as email');
                isValid = false;
            }

            if (isValid) {
                successMessage.classList.add('visible');
            }
        });
    </script>
</body>
</html>
